<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js"></script>
</head>
<body>
    <h1 id="s">^-^ Hello Viyanjana ^-^</h1>
    <p class="title">welcome to javaScript</p>
    <p class ="title">Mern stack internship</p>
    <h3>sara</h3>
    <h3>priya</h3>
    <h3>viyanjana</h3>
    <h3>rubika</h3>
    <h3>shailu</h3>
    
    <button id="btn">click</button>
    <h4 id="helo">button color changed</h4>
    <button id="btn1">click</button>
    <h5 id="text"></h5>
</body>
<script>
    document.getElementById("s").style.color="purple";
    let elements=document.getElementsByClassName("title")
    for(let i=0;i<elements.length;i++){
        elements[i].style.backgroundColor="lavender"
        elements[i].style.fontSize="20px"
    }
    
    let elem = document.getElementById("btn")
    elem.addEventListener("click",()=>{
        document.getElementById("helo").style.color="brown"
    })

    let elem1 = document.getElementById("btn1")
    elem1.addEventListener("click",()=>{
        document.getElementById("text").innerHTML="Hey What ^-^"
    })
</script>

</html>
